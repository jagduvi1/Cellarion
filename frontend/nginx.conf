map $http_user_agent $is_crawler {
    default                 0;
    # Social link-preview bots
    ~*Twitterbot            1;
    ~*facebookexternalhit   1;
    ~*LinkedInBot           1;
    ~*WhatsApp              1;
    ~*Discordbot            1;
    ~*TelegramBot           1;
    ~*Slackbot              1;
    # Traditional search engines
    ~*Googlebot             1;
    ~*bingbot               1;
    ~*Applebot              1;
    ~*DuckDuckBot           1;
    ~*YandexBot             1;
    # AI crawlers — route to og.js so AI engines see full HTML, JSON-LD, and prose,
    # not the empty SPA shell. This is the difference between being citable or not.
    ~*GPTBot                1;
    ~*ChatGPT-User          1;
    ~*OAI-SearchBot         1;
    ~*ClaudeBot             1;
    ~*anthropic-ai          1;
    ~*Claude-Web            1;
    ~*PerplexityBot         1;
    ~*Perplexity-User       1;
    ~*Google-Extended       1;
    ~*Applebot-Extended     1;
    ~*CCBot                 1;
    ~*cohere-ai             1;
    ~*Meta-ExternalAgent    1;
    ~*Bytespider            1;
    ~*DuckAssistBot         1;
}

server {
    listen 80;
    server_name _;

    # Allow large uploads (bottle images)
    client_max_body_size 50m;

    # Gzip compression — reduces transfer size for JS/CSS/JSON
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Proxy all /api/ requests to the Express backend.
    # ^~ ensures this prefix match wins over the static-file regex below,
    # so /api/uploads/processed/*.png is proxied, not served as static.
    location ^~ /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Extended timeout for rembg background-removal (can be slow on first run)
        proxy_read_timeout 120s;
    }

    # Rewrite sitemap.xml to /api/ path so it flows through the existing proxy
    location = /sitemap.xml {
        rewrite ^ /api/sitemap.xml break;
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # IndexNow key verification file — proxy to backend
    location ~ "^/[a-f0-9]{32}\.txt$" {
        rewrite ^(.*)$ /api$1 break;
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Search engine crawlers get server-rendered HTML with full content,
    # structured data (JSON-LD), and meta tags from the backend OG endpoints.
    # Real users get the SPA as usual. Uses $is_crawler map variable.

    # Wine detail pages — accepts both /wines/<ObjectId> AND /wines/<slug>.
    # The og.js endpoint 301-redirects ObjectId URLs to their slug form when
    # one exists, preserving link equity from any external links to old URLs.
    location ~ "^/wines/([a-f0-9]{24})$" {
        error_page 418 = @wine_og;
        if ($is_crawler) {
            return 418;
        }
        # Real users get the SPA — frontend handles ObjectId→slug replaceState there
        root       /usr/share/nginx/html;
        try_files  /index.html =404;
    }

    location ~ "^/wines/([a-z0-9]+(?:-[a-z0-9]+)*)$" {
        error_page 418 = @wine_og;
        if ($is_crawler) {
            return 418;
        }
        root       /usr/share/nginx/html;
        try_files  /index.html =404;
    }

    location @wine_og {
        rewrite ^/wines/(.+)$ /api/og/wines/$1 break;
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Wine type pages — /wines/type/<type>
    location ~ "^/wines/type/[a-z]+$" {
        error_page 418 = @wine_type_og;
        if ($is_crawler) {
            return 418;
        }
        root       /usr/share/nginx/html;
        try_files  /index.html =404;
    }

    location @wine_type_og {
        rewrite ^/wines/type/(.+)$ /api/og/wine-types/$1 break;
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Taxonomy pages — /regions/:slug, /countries/:slug, /grapes/:slug
    location ~ "^/(regions|countries|grapes)/[a-z0-9]+(?:-[a-z0-9]+)*$" {
        error_page 418 = @taxonomy_og;
        if ($is_crawler) {
            return 418;
        }
        root       /usr/share/nginx/html;
        try_files  /index.html =404;
    }

    location @taxonomy_og {
        rewrite ^(.*)$ /api/og$1 break;
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Blog post pages — /blog/<slug>
    location ~ "^/blog/([a-z0-9]+(?:-[a-z0-9]+)*)$" {
        error_page 418 = @blog_og;
        if ($is_crawler) {
            return 418;
        }
        root       /usr/share/nginx/html;
        try_files  /index.html =404;
    }

    location @blog_og {
        rewrite ^/blog/(.+)$ /api/og/blog/$1 break;
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Community discussions — public forum. Crawlers get server-rendered HTML
    # with DiscussionForumPosting JSON-LD; real users get the SPA.
    # Matches /community/discussions and /community/discussions/<slug-or-id>.
    location = /community/discussions {
        error_page 418 = @community_og;
        if ($is_crawler) {
            return 418;
        }
        root       /usr/share/nginx/html;
        try_files  /index.html =404;
    }

    location ~ "^/community/discussions/[A-Za-z0-9_-]+$" {
        error_page 418 = @community_og;
        if ($is_crawler) {
            return 418;
        }
        root       /usr/share/nginx/html;
        try_files  /index.html =404;
    }

    location @community_og {
        rewrite ^(.*)$ /api/og$1 break;
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # index.html and the service worker must NEVER be cached. index.html maps to
    # build-hashed bundles (a stale copy 404s after the next deploy) and a stale
    # SW keeps serving an old shell. Exact-match locations so the bare `/`, a
    # direct `/index.html`, and `/service-worker.js` all get no-store — the
    # @spa_shell fallback below only covers client-side routes, not these.
    location = / {
        # Crawlers (incl. AI bots) get the server-rendered landing page from
        # og.js — full pitch, FAQ, and JSON-LD (WebSite/Organization/
        # SoftwareApplication/FAQPage) — instead of the empty SPA shell, whose
        # schema/prose are injected by JS that non-rendering bots never run.
        # This is the difference between the homepage being citable or not.
        error_page 418 = @home_og;
        if ($is_crawler) {
            return 418;
        }
        root              /usr/share/nginx/html;
        add_header        Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header        Pragma                                "no-cache"  always;
        add_header        Expires                               "0"         always;
        # Security headers on the app shell. nginx does NOT inherit server-level
        # add_header into a location that sets its own, so they're repeated on
        # each HTML location. X-Frame-Options stops clickjacking; nosniff stops
        # MIME confusion; Referrer-Policy limits referer leakage. (HSTS is set
        # at Cloudflare, the TLS-terminating layer.)
        add_header        X-Frame-Options                       "DENY"      always;
        add_header        X-Content-Type-Options                "nosniff"   always;
        add_header        Referrer-Policy   "strict-origin-when-cross-origin" always;
        try_files         /index.html =404;
    }

    location @home_og {
        rewrite ^ /api/og/home break;
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Help page — crawlers get the server-rendered guide + FAQPage JSON-LD
    # (built from helpContent.js); real users get the SPA.
    location = /help {
        error_page 418 = @help_og;
        if ($is_crawler) {
            return 418;
        }
        root              /usr/share/nginx/html;
        add_header        Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header        Pragma                                "no-cache"  always;
        add_header        Expires                               "0"         always;
        add_header        X-Frame-Options                       "DENY"      always;
        add_header        X-Content-Type-Options                "nosniff"   always;
        add_header        Referrer-Policy   "strict-origin-when-cross-origin" always;
        try_files         /index.html =404;
    }

    location @help_og {
        rewrite ^ /api/og/help break;
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Blog index — crawlers get the server-rendered post list + CollectionPage
    # JSON-LD; real users get the SPA. Individual /blog/<slug> posts are handled
    # by the regex location further below.
    location = /blog {
        error_page 418 = @blog_index_og;
        if ($is_crawler) {
            return 418;
        }
        root              /usr/share/nginx/html;
        add_header        Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header        Pragma                                "no-cache"  always;
        add_header        Expires                               "0"         always;
        add_header        X-Frame-Options                       "DENY"      always;
        add_header        X-Content-Type-Options                "nosniff"   always;
        add_header        Referrer-Policy   "strict-origin-when-cross-origin" always;
        try_files         /index.html =404;
    }

    location @blog_index_og {
        rewrite ^ /api/og/blog break;
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location = /index.html {
        root              /usr/share/nginx/html;
        add_header        Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header        Pragma                                "no-cache"  always;
        add_header        Expires                               "0"         always;
        add_header        X-Frame-Options                       "DENY"      always;
        add_header        X-Content-Type-Options                "nosniff"   always;
        add_header        Referrer-Policy   "strict-origin-when-cross-origin" always;
    }
    location = /service-worker.js {
        root              /usr/share/nginx/html;
        add_header        Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header        Pragma                                "no-cache"  always;
        add_header        Expires                               "0"         always;
        try_files         /service-worker.js =404;
    }

    # Serve the React SPA — fall back to index.html for client-side routing.
    # The SPA shell goes through a named-location fallback so the no-cache
    # header reliably applies, even when /index.html is served as the result
    # of an internal try_files redirect from /cellars/123 / /bottles / etc.
    location / {
        root       /usr/share/nginx/html;
        index      index.html;
        try_files  $uri $uri/ @spa_shell;
    }

    # The SPA shell (index.html) references hashed JS/CSS bundles that
    # change on every build. Without no-cache, a browser that hangs on to
    # a stale index.html after a deploy will request asset hashes that no
    # longer exist (404) — observed after v1.54.2. `always` ensures the
    # header is emitted even on 304/non-2xx responses.
    location @spa_shell {
        root              /usr/share/nginx/html;
        add_header        Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header        Pragma                                "no-cache"  always;
        add_header        Expires                               "0"         always;
        add_header        X-Frame-Options                       "DENY"      always;
        add_header        X-Content-Type-Options                "nosniff"   always;
        add_header        Referrer-Policy   "strict-origin-when-cross-origin" always;
        try_files         /index.html =404;
    }

    # Long-lived cache for hashed static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root              /usr/share/nginx/html;
        expires           1y;
        add_header        Cache-Control "public, immutable";
        try_files         $uri =404;
    }
}
