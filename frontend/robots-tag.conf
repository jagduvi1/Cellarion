# Search engines may index one host only: CELLARION_INDEXABLE_HOST
# (cellarion.app unless the environment says otherwise, see the Dockerfile).
# Every other host answers with X-Robots-Tag: noindex (nginx.conf at server
# level and security-headers.conf), so a self-hosted install, a LAN address or
# a staging copy never competes with the public site in search results. On
# the indexable host the value is empty, and nginx sends no header for an
# empty add_header. The variable is a bare host name: no scheme, no port.
#
# A template of its own (rendered into conf.d/ at the http level like
# nginx.conf), so an install that mounts its own copy of nginx.conf still has
# the $robots_tag that security-headers.conf uses. The larger bucket lets a
# host name longer than ~46 characters fit; the default makes nginx refuse to
# start.
map_hash_bucket_size 128;

map $host $robots_tag {
    default                       "noindex, nofollow";
    "${CELLARION_INDEXABLE_HOST}" "";
}
