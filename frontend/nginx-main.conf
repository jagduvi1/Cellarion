# /etc/nginx/nginx.conf for the frontend image. It is the stock file of the
# pinned nginxinc/nginx-unprivileged:alpine base, with TWO changes:
# worker_connections and worker_rlimit_nofile. Refresh it from the base image
# when the base is bumped.
#
# Why (scaling audit 2026-09-25, item 17): the stock 1024 connections per
# worker are shared by everything, and each proxied request or long-lived
# stream (Home Assistant events, MCP sessions) holds two: the client's and the
# one to the backend. At about a thousand streams nginx would refuse all
# traffic.
#
# worker_rlimit_nofile: the container's SOFT open-file limit is 1024, and nginx
# does not raise it by itself — without this line the 8192 connections were a
# no-op ("8192 worker_connections exceed open file resource limit: 1024" in the
# live log; audit 2026-09-27 M8). Each connection holds one descriptor, and a
# proxied one a second; 16384 covers a full worker with room for files.
worker_processes  auto;
worker_rlimit_nofile  16384;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;


events {
    worker_connections  8192;
}


http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
