# /etc/nginx/nginx.conf for the frontend image. It is the stock file of the
# pinned nginxinc/nginx-unprivileged:alpine base, with ONE change:
# worker_connections. Refresh it from the base image when the base is bumped.
#
# Why (scaling audit 2026-09-25, item 17): the stock 1024 connections per
# worker are shared by everything, and each proxied request or long-lived
# stream (Home Assistant events, MCP sessions) holds two: the client's and the
# one to the backend. At about a thousand streams nginx would refuse all
# traffic. The container allows far more open files than this (ulimit -n).
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;


events {
    worker_connections  8192;
}


http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
