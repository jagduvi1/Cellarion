# Container hardening (audit L-25): every service drops all Linux capabilities
# and forbids privilege escalation (no-new-privileges blocks setuid binaries;
# it does NOT block gosu/su-exec, which use plain setuid() syscalls). Services
# whose entrypoint starts as root and steps down to a service user get the
# minimal cap_add set that step-down needs.
services:
  mongo:
    image: mongo:7
    container_name: cellarion-mongo
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Entrypoint starts as root, chowns /data/db, then gosu's down to the
    # mongodb user — the minimal caps that dance needs. DAC_OVERRIDE is
    # required for EXISTING volumes: the root entrypoint must traverse data
    # files already owned by the mongodb user (0700 dirs), which a capless
    # root cannot (a fresh volume boots without it; a restart with data fails).
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    # WiredTiger cache must stay well under the container limit (512M below) —
    # cache + connection/aggregation overhead beyond the limit gets the
    # container OOM-killed under load. ~50% of the limit is the safe ratio.
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo-data:/data/db
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.45.1
    container_name: cellarion-meilisearch
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_ENV=production
      # Meilisearch budgets indexing memory as 2/3 of the HOST's RAM (it cannot
      # see the cgroup limit) and spawns one indexing thread per host core — on
      # any machine with real RAM that blows straight through the 256M container
      # limit and OOM-crash-loops the first full reindex (restore drills, wiped
      # volume, MEILI_FORCE_REINDEX). Budget must stay well under the limit.
      - MEILI_MAX_INDEXING_MEMORY=128Mb
      - MEILI_MAX_INDEXING_THREADS=2
    volumes:
      - meili-data:/meili_data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.18.1
    container_name: cellarion-qdrant
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - qdrant-data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build: ./backend
    container_name: cellarion-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # Belt-and-braces with the Dockerfile ENV (audit L-22): secure refresh
      # cookie + redacted 5xx bodies must not depend on out-of-band config.
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/winecellar
      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_TOKEN_EXPIRES_IN=${ACCESS_TOKEN_EXPIRES_IN:-15m}
      - PORT=5000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - BACKEND_URL=${BACKEND_URL:-}
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_SEARCH_KEY=${MEILI_SEARCH_KEY:-}
      - REMBG_URL=http://rembg:5000
      - LOG_LEVEL=${LOG_LEVEL:-}
      - AUDIT_TTL_DAYS=${AUDIT_TTL_DAYS:-}
      - INDEXNOW_KEY=${INDEXNOW_KEY:-}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY:-}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN:-}
      - MAILGUN_FROM=${MAILGUN_FROM:-}
      - MAILGUN_API_URL=${MAILGUN_API_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:-}
      - QDRANT_URL=http://qdrant:6333
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-}
      - SUPER_ADMIN_IPS=${SUPER_ADMIN_IPS:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_EMAIL=${VAPID_EMAIL:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_SUPPORTER_PRICE_ID=${STRIPE_SUPPORTER_PRICE_ID:-}
      - STRIPE_PATRON_PRICE_ID=${STRIPE_PATRON_PRICE_ID:-}
    volumes:
      - image-data:/app/uploads
    deploy:
      resources:
        limits:
          # Stopgap until the full-cellar-hydration endpoints move to
          # aggregation: a few concurrent big-cellar page loads peak well
          # past 384M. Sized for the current 4GB host alongside the other
          # services' caps.
          memory: 640M
    depends_on:
      mongo:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  rembg:
    build: ./rembg
    container_name: cellarion-rembg
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1536M

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        VITE_UMAMI_URL: ${VITE_UMAMI_URL:-}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
        VITE_SITE_URL: ${VITE_SITE_URL:-}
    container_name: cellarion-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 64M
    # 8080: nginxinc/nginx-unprivileged serve stage — non-root nginx cannot
    # bind :80. Local port 80 mapping lives in docker-compose.override.yml.
    expose:
      - "8080"
    networks:
      - web
      - default
    labels:
      traefik.enable: "true"
      traefik.docker.network: "web"
      traefik.http.routers.cellarion.rule: "Host(`cellarion.app`)"
      traefik.http.routers.cellarion.entrypoints: "web"
      traefik.http.services.cellarion.loadbalancer.server.port: "8080"
    depends_on:
      backend:
        condition: service_healthy

  # Umami — privacy-friendly self-hosted analytics. Only loaded by the frontend when
  # VITE_UMAMI_URL and VITE_UMAMI_WEBSITE_ID are set at build time, so this
  # service is optional and inert without those vars.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: cellarion-umami
    restart: unless-stopped
    # Opt-in: only starts with `docker compose --profile analytics up`. It is
    # useless without the build-time VITE_UMAMI_* vars anyway, so keeping it down
    # by default lets us drop the weak fallback secrets that used to ship here.
    # Set strong UMAMI_DB_PASSWORD / UMAMI_APP_SECRET in .env before enabling the
    # profile (an empty password makes Postgres/Umami fail to start — fail-closed,
    # and never a guessable committed default). Matches docker-compose.prod.yml.
    profiles: ["analytics"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      - DATABASE_TYPE=postgresql
      - APP_SECRET=${UMAMI_APP_SECRET}
    deploy:
      resources:
        limits:
          memory: 256M
    expose:
      - "3000"
    networks:
      - web
      - default
    labels:
      traefik.enable: "true"
      traefik.docker.network: "web"
      traefik.http.routers.umami.rule: "Host(`analytics.cellarion.app`)"
      traefik.http.routers.umami.entrypoints: "web"
      traefik.http.services.umami.loadbalancer.server.port: "3000"
    depends_on:
      umami-db:
        condition: service_healthy

  umami-db:
    image: postgres:16-alpine
    container_name: cellarion-umami-db
    restart: unless-stopped
    profiles: ["analytics"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Entrypoint starts as root, fixes PGDATA ownership/permissions, then
    # su-exec's down to the postgres user — the minimal caps that needs.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      - POSTGRES_DB=umami
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  meili-data:
  qdrant-data:
  image-data:
  umami-db-data:

networks:
  web:
    external: true
