# Container hardening (audit L-25): every service drops all Linux capabilities
# and forbids privilege escalation (no-new-privileges blocks setuid binaries;
# it does NOT block gosu/su-exec, which use plain setuid() syscalls). Services
# whose entrypoint starts as root and steps down to a service user get the
# minimal cap_add set that step-down needs.
services:
  mongo:
    # Digest-pinned (security audit L-11): mongo:7 is a moving minor tag.
    # Dependabot's docker ecosystem bumps this; the tag is kept for readability.
    image: mongo:7@sha256:340c1c56fb10e95cf79ff547f8664b96bc6ead9909bc355238cbf865a9695a6f
    container_name: cellarion-mongo
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Entrypoint starts as root, chowns /data/db, then gosu's down to the
    # mongodb user — the minimal caps that dance needs. DAC_OVERRIDE is
    # required for EXISTING volumes: the root entrypoint must traverse data
    # files already owned by the mongodb user (0700 dirs), which a capless
    # root cannot (a fresh volume boots without it; a restart with data fails).
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    # WiredTiger cache must stay well under the container limit (512M below) —
    # cache + connection/aggregation overhead beyond the limit gets the
    # container OOM-killed under load. ~50% of the limit is the safe ratio.
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo-data:/data/db
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.45.1
    container_name: cellarion-meilisearch
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_ENV=production
      # Meilisearch budgets indexing memory as 2/3 of the HOST's RAM (it cannot
      # see the cgroup limit) and spawns one indexing thread per host core — on
      # any machine with real RAM that blows straight through the 256M container
      # limit and OOM-crash-loops the first full reindex (restore drills, wiped
      # volume, MEILI_FORCE_REINDEX). Budget must stay well under the limit.
      - MEILI_MAX_INDEXING_MEMORY=128Mb
      - MEILI_MAX_INDEXING_THREADS=2
    volumes:
      - meili-data:/meili_data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.18.1
    container_name: cellarion-qdrant
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Optional API-key auth (security audit L-5). Qdrant is internal-only and not
    # host-published, so this defaults OFF (empty = no auth, unchanged behaviour).
    # Set QDRANT_API_KEY in .env to require the key here AND on the backend below;
    # the readiness endpoints used by the healthcheck stay key-exempt.
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
    volumes:
      - qdrant-data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build: ./backend
    container_name: cellarion-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # Belt-and-braces with the Dockerfile ENV (audit L-22): secure refresh
      # cookie + redacted 5xx bodies must not depend on out-of-band config.
      - NODE_ENV=production
      # Cap V8's heap BELOW the 640M cgroup limit below — without this V8 sizes
      # its heap from HOST RAM (~2GB on a 4GB box) and the kernel OOM-killer
      # fires before GC pressure, killing the whole container (grand-audit H4).
      - NODE_OPTIONS=${NODE_OPTIONS:---max-old-space-size=480}
      # Self-hosters on plain HTTP must set COOKIE_SECURE=false or the refresh
      # cookie is dropped (Secure is otherwise inferred from NODE_ENV=production).
      # The env block enumerates vars, so it must be forwarded to be settable.
      - COOKIE_SECURE=${COOKIE_SECURE:-}
      # Reverse-proxy hop count for req.ip resolution (security audit M-3).
      # Default 1 matches this shipped single-hop chain (nginx → backend). The
      # hosted CF→Traefik→nginx deploy sets TRUST_PROXY_HOPS=2 in its .env.
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/winecellar}
      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_TOKEN_EXPIRES_IN=${ACCESS_TOKEN_EXPIRES_IN:-15m}
      - PORT=5000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - BACKEND_URL=${BACKEND_URL:-}
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_SEARCH_KEY=${MEILI_SEARCH_KEY:-}
      # Recovery lever: set to 1 in .env to force a full Meili reindex on boot.
      - MEILI_FORCE_REINDEX=${MEILI_FORCE_REINDEX:-}
      - REMBG_URL=http://rembg:5000
      # Climate monitoring knobs (all optional; unset keeps in-code defaults).
      # A GDPR storage-limitation lever — must be forwarded to be settable.
      - CLIMATE_RETENTION_DAYS=${CLIMATE_RETENTION_DAYS:-}
      - CLIMATE_MAX_DEVICES_PER_USER=${CLIMATE_MAX_DEVICES_PER_USER:-}
      - CLIMATE_SUGGESTED_INTERVAL_S=${CLIMATE_SUGGESTED_INTERVAL_S:-}
      - CLIMATE_MAX_READINGS_PER_DAY=${CLIMATE_MAX_READINGS_PER_DAY:-}
      - LOG_LEVEL=${LOG_LEVEL:-}
      - AUDIT_TTL_DAYS=${AUDIT_TTL_DAYS:-}
      - INDEXNOW_KEY=${INDEXNOW_KEY:-}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY:-}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN:-}
      - MAILGUN_FROM=${MAILGUN_FROM:-}
      - MAILGUN_API_URL=${MAILGUN_API_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:-}
      # Self-hosted AI provider (issue #698) — optional; unset keeps Anthropic.
      - AI_PROVIDER=${AI_PROVIDER:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-}
      - AI_VISION_MODEL=${AI_VISION_MODEL:-}
      - OPENAI_TIMEOUT_MS=${OPENAI_TIMEOUT_MS:-}
      # Self-hosted embeddings (issue #698 phase 2) — optional; unset keeps Voyage.
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-}
      - EMBEDDING_TIMEOUT_MS=${EMBEDDING_TIMEOUT_MS:-}
      - QDRANT_URL=http://qdrant:6333
      # Optional Qdrant API key (security audit L-5) — must match the qdrant
      # service's QDRANT__SERVICE__API_KEY above. Empty = no auth (default).
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-}
      - SUPER_ADMIN_IPS=${SUPER_ADMIN_IPS:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_EMAIL=${VAPID_EMAIL:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      # One var per (tier, interval). The backend enumerates env explicitly, so
      # an id set in .env but not forwarded here is invisible to the container —
      # which is exactly why the yearly buttons never worked: the two ANNUAL
      # vars existed in .env.example but were never passed through.
      - STRIPE_SUPPORTER_PRICE_ID=${STRIPE_SUPPORTER_PRICE_ID:-}
      - STRIPE_PATRON_PRICE_ID=${STRIPE_PATRON_PRICE_ID:-}
      - STRIPE_BENEFACTOR_PRICE_ID=${STRIPE_BENEFACTOR_PRICE_ID:-}
      - STRIPE_SUPPORTER_ANNUAL_PRICE_ID=${STRIPE_SUPPORTER_ANNUAL_PRICE_ID:-}
      - STRIPE_PATRON_ANNUAL_PRICE_ID=${STRIPE_PATRON_ANNUAL_PRICE_ID:-}
      - STRIPE_BENEFACTOR_ANNUAL_PRICE_ID=${STRIPE_BENEFACTOR_ANNUAL_PRICE_ID:-}
      # Google Sign-In (SSO) — optional; unset leaves email/password login
      # untouched. The backend env block enumerates vars explicitly, so these
      # must be forwarded or the container never sees them even when set in .env.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-}
    volumes:
      - image-data:/app/uploads
    deploy:
      resources:
        limits:
          # Stopgap until the full-cellar-hydration endpoints move to
          # aggregation: a few concurrent big-cellar page loads peak well
          # past 384M. Sized for the current 4GB host alongside the other
          # services' caps.
          memory: 640M
    depends_on:
      mongo:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  rembg:
    build: ./rembg
    container_name: cellarion-rembg
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1536M

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        VITE_UMAMI_URL: ${VITE_UMAMI_URL:-}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
        VITE_SITE_URL: ${VITE_SITE_URL:-}
    container_name: cellarion-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 64M
    # 8080: nginxinc/nginx-unprivileged serve stage — non-root nginx cannot
    # bind :80. Local port 80 mapping lives in docker-compose.override.yml.
    expose:
      - "8080"
    networks:
      - web
      - default
    labels:
      traefik.enable: "true"
      traefik.docker.network: "web"
      traefik.http.routers.cellarion.rule: "Host(`cellarion.app`)"
      traefik.http.routers.cellarion.entrypoints: "web"
      traefik.http.services.cellarion.loadbalancer.server.port: "8080"
    depends_on:
      backend:
        condition: service_healthy

  # Umami — privacy-friendly self-hosted analytics. Only loaded by the frontend when
  # VITE_UMAMI_URL and VITE_UMAMI_WEBSITE_ID are set at build time, so this
  # service is optional and inert without those vars.
  umami:
    # Digest-pinned (security audit L-11): `:postgresql-latest` is a fully
    # moving tag — the worst supply-chain case. Dependabot bumps it.
    image: ghcr.io/umami-software/umami:postgresql-latest@sha256:8edfe4beaef13f9d1300619fa264ef250a3688df9cc54d24ca830ca31cb475ec
    container_name: cellarion-umami
    restart: unless-stopped
    # Opt-in: only starts with `docker compose --profile analytics up`. It is
    # useless without the build-time VITE_UMAMI_* vars anyway, so keeping it down
    # by default lets us drop the weak fallback secrets that used to ship here.
    # Set strong UMAMI_DB_PASSWORD / UMAMI_APP_SECRET in .env before enabling the
    # profile (an empty password makes Postgres/Umami fail to start — fail-closed,
    # and never a guessable committed default). Matches docker-compose.prod.yml.
    profiles: ["analytics"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
      - DATABASE_TYPE=postgresql
      - APP_SECRET=${UMAMI_APP_SECRET}
    deploy:
      resources:
        limits:
          memory: 256M
    expose:
      - "3000"
    networks:
      - web
      - default
    labels:
      traefik.enable: "true"
      traefik.docker.network: "web"
      traefik.http.routers.umami.rule: "Host(`analytics.cellarion.app`)"
      traefik.http.routers.umami.entrypoints: "web"
      traefik.http.services.umami.loadbalancer.server.port: "3000"
    depends_on:
      umami-db:
        condition: service_healthy

  umami-db:
    # Digest-pinned (security audit L-11). Dependabot bumps it.
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: cellarion-umami-db
    restart: unless-stopped
    profiles: ["analytics"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Entrypoint starts as root, fixes PGDATA ownership/permissions, then
    # su-exec's down to the postgres user — the minimal caps that needs.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      - POSTGRES_DB=umami
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  meili-data:
  qdrant-data:
  image-data:
  umami-db-data:

networks:
  web:
    external: true
