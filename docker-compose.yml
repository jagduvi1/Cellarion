services:
  mongo:
    image: mongo:7
    container_name: cellarion-mongo
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    volumes:
      - mongo-data:/data/db
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.45.1
    container_name: cellarion-meilisearch
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_ENV=production
    volumes:
      - meili-data:/meili_data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.18.1
    container_name: cellarion-qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build: ./backend
    container_name: cellarion-backend
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://mongo:27017/winecellar
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - PORT=5000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - REMBG_URL=http://rembg:5000
      - MAILGUN_API_KEY=${MAILGUN_API_KEY:-}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN:-}
      - MAILGUN_FROM=${MAILGUN_FROM:-}
      - MAILGUN_API_URL=${MAILGUN_API_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:-}
      - QDRANT_URL=http://qdrant:6333
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL:-}
      - SUPER_ADMIN_IPS=${SUPER_ADMIN_IPS:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_EMAIL=${VAPID_EMAIL:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_SUPPORTER_PRICE_ID=${STRIPE_SUPPORTER_PRICE_ID:-}
      - STRIPE_PATRON_PRICE_ID=${STRIPE_PATRON_PRICE_ID:-}
    volumes:
      - image-data:/app/uploads
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      mongo:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  rembg:
    build: ./rembg
    container_name: cellarion-rembg
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1536M

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        VITE_UMAMI_URL: ${VITE_UMAMI_URL:-}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
    container_name: cellarion-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
    expose:
      - "80"
    networks:
      - web
      - default
    labels:
      traefik.enable: "true"
      traefik.docker.network: "web"
      traefik.http.routers.cellarion.rule: "Host(`cellarion.app`)"
      traefik.http.routers.cellarion.entrypoints: "web"
      traefik.http.services.cellarion.loadbalancer.server.port: "80"
    depends_on:
      backend:
        condition: service_healthy

  # Umami — privacy-friendly self-hosted analytics. Only loaded by the frontend when
  # VITE_UMAMI_URL and VITE_UMAMI_WEBSITE_ID are set at build time, so this
  # service is optional and inert without those vars.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: cellarion-umami
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASSWORD:-umami}@umami-db:5432/umami
      - DATABASE_TYPE=postgresql
      - APP_SECRET=${UMAMI_APP_SECRET:-replace-with-random-string-in-production}
    deploy:
      resources:
        limits:
          memory: 256M
    expose:
      - "3000"
    networks:
      - web
      - default
    labels:
      traefik.enable: "true"
      traefik.docker.network: "web"
      traefik.http.routers.umami.rule: "Host(`analytics.cellarion.app`)"
      traefik.http.routers.umami.entrypoints: "web"
      traefik.http.services.umami.loadbalancer.server.port: "3000"
    depends_on:
      umami-db:
        condition: service_healthy

  umami-db:
    image: postgres:16-alpine
    container_name: cellarion-umami-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=umami
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD:-umami}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
  meili-data:
  qdrant-data:
  image-data:
  umami-db-data:

networks:
  web:
    external: true
