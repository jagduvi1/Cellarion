# Keeps the supply-chain pins current (security audit 2026-07-17, M-5 + L-11).
# Both the SHA-pinned GitHub Actions and the @sha256 digest-pinned base images
# are frozen on purpose — Dependabot is what turns "frozen" into "frozen but
# maintained", opening a PR when a new version/digest is published so a pin can
# never silently rot into an unpatched base. Weekly + grouped to stay low-noise
# for a solo maintainer; npm is intentionally left out (handled manually).
version: 2
updates:
  # CI workflow actions — Dependabot understands `@<sha> # vX.Y.Z` pins and
  # bumps both the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Container base images: one directory per Dockerfile. All are digest-pinned,
  # so these bump the @sha256. The docker ecosystem reads Dockerfiles only; the
  # images docker-compose.yml pulls have their own entry below.
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /rembg
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]
    ignore:
      # Node majors are chosen by LTS status, not by "newest". Dependabot offers
      # the Current line the moment it exists (it proposed 26 in #751, three
      # months before 26 becomes LTS on 2026-10-28), and re-proposes it weekly.
      # Digest bumps WITHIN the pinned major still come through — this only
      # suppresses the major hop, which we take deliberately when a line goes
      # Active LTS. Bump/remove this when moving to the next LTS.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # A Python minor (3.14 → 3.15) is taken deliberately too: rembg's
      # dependencies must publish wheels for it first, or pip falls back to
      # building them from source and the slim image has no compiler. Digest
      # bumps within the pinned minor still come through.
      - dependency-name: python
        update-types: ["version-update:semver-minor"]

  # Images docker-compose.yml pulls (mongo, meilisearch, umami, postgres). All
  # are tag + digest pinned, so these bump the @sha256, and the tag too when a
  # new Meilisearch minor is out. Its own group, deliberately NOT in the list
  # that dependabot-automerge.yml merges: docker-compose.yml is the stack
  # self-hosters run, a merged bump reaches their data on their next pull, and
  # a Meilisearch minor migrates its data directory in place (MEILI_UPGRADE_DB)
  # with a reindex as the only way back. CI does not start these images, so
  # green checks say nothing about them; a person reads each one.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
    ignore:
      # A datastore major is a data migration for every self-hoster, taken
      # deliberately, not a pin refresh.
      - dependency-name: mongo
        update-types: ["version-update:semver-major"]
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: getmeili/meilisearch
        update-types: ["version-update:semver-major"]
