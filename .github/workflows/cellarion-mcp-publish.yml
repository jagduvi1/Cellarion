name: Publish cellarion-mcp

# Publishes the stdio bridge (cellarion-mcp/) to npm with npm Trusted
# Publishing: GitHub's OIDC token proves the run is this workflow in this
# repository, so no npm token is stored anywhere and no 2FA prompt is needed.
# npm attaches a provenance attestation to the release automatically.
#
# One-time setup on npmjs.com (package cellarion-mcp → Settings → Trusted
# Publisher → GitHub Actions): organization or user `jagduvi1`, repository
# `Cellarion`, workflow filename `cellarion-mcp-publish.yml`. The fields are
# case-sensitive and the filename must match this file exactly.
#
# To release: bump the version in cellarion-mcp/package.json and the root of
# its package-lock.json in a PR, merge it, then push the tag
# `cellarion-mcp-v<version>` on that commit of main. mcp-registry/README.md
# has the registry step that follows.

on:
  push:
    tags: ['cellarion-mcp-v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

concurrency:
  group: cellarion-mcp-publish
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Publish cellarion-mcp to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cellarion-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the main-ancestry check below needs history

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # no cache in a release build

      # Trusted publishing needs npm 11.5.1 or later.
      - name: npm with trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: The tag names this package's version, on main
        run: |
          want="cellarion-mcp-v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json (expected $want)"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Publish
        run: npm publish --access public
