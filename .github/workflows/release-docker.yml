name: Build Docker images on Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

# GitHub forces JS actions onto Node 24 from 2026-06-16; opt in now so any
# incompatibility surfaces on our schedule, not mid-release
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Prepare variables (lowercase owner + normalized tag)
        id: vars
        shell: bash
        # Untrusted values reach the shell via env, never via ${{ }} inside
        # run: — a tag like `v1$(cmd)` would otherwise execute on a runner
        # holding packages:write (GHCR poisoning). Env vars are inert data.
        env:
          TAG_RAW: ${{ github.ref_name }}
          OWNER_RAW: ${{ github.repository_owner }}
        run: |
          if [[ ! "$TAG_RAW" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG_RAW' does not match vX.Y.Z — refusing to build."
            exit 1
          fi
          OWNER_LOWER=$(echo "$OWNER_RAW" | tr '[:upper:]' '[:lower:]')
          TAG="${TAG_RAW#v}"                       # strip the leading v
          echo "owner=${OWNER_LOWER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend
      - name: Build & push backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/cellarion-backend:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.vars.outputs.owner }}/cellarion-backend:latest

      # Frontend
      - name: Build & push frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          push: true
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.tag }}
            VITE_UMAMI_URL=${{ vars.VITE_UMAMI_URL }}
            VITE_UMAMI_WEBSITE_ID=${{ vars.VITE_UMAMI_WEBSITE_ID }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/cellarion-frontend:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.vars.outputs.owner }}/cellarion-frontend:latest

      # rembg
      - name: Build & push rembg
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./rembg
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/cellarion-rembg:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.vars.outputs.owner }}/cellarion-rembg:latest
